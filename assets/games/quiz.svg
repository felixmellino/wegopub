<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
<style>
.bub{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.q{transform-origin:58px 50px;animation:tilt 2.2s ease-in-out infinite}
@keyframes tilt{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.tw{transform-origin:center;transform-box:fill-box;animation:tw 1.6s ease-in-out infinite}
.t2{animation-delay:.5s}.t3{animation-delay:1s}
@keyframes tw{0%,100%{transform:scale(.3);opacity:0}50%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.tw{opacity:1}}
</style>
