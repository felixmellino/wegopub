<!doctype html>
<html><head><meta charset="utf-8"></head>
<body>
<script>
// Follows the phone's GPS automatically while the page is open (R-L01).
// With the argument once=true it only asks once: used right after login so
// the browser shows its "Allow location?" prompt straight away.
// Sends {lat, lng, accuracy_m, taken_at_ms} to Streamlit when the player
// first gets a fix, moves more than MIN_MOVE_M, crosses the 50 m accuracy
// limit, or every HEARTBEAT_MS so the reading stays fresh (R-L04).
// Nothing is stored here; coordinates only live in the open session.
const MIN_MOVE_M = 20;
const ACCURACY_LIMIT_M = 50;
const HEARTBEAT_MS = 30000;

let started = false;
let lastSent = null;      // last reading sent to Streamlit
let lastSentAt = 0;
let lastError = null;
let latest = null;        // newest reading from the phone

function send(type, details) {
  window.parent.postMessage({isStreamlitMessage: true, type, ...details}, "*");
}
function sendValue(value) {
  send("streamlit:setComponentValue", {value, dataType: "json"});
}

function metresBetween(a, b) {
  const rad = Math.PI / 180;
  const x = (b.lng - a.lng) * rad * Math.cos(((a.lat + b.lat) / 2) * rad);
  const y = (b.lat - a.lat) * rad;
  return Math.sqrt(x * x + y * y) * 6371000;
}

function onPosition(position) {
  latest = {
    lat: position.coords.latitude,
    lng: position.coords.longitude,
    accuracy_m: position.coords.accuracy,
    taken_at_ms: position.timestamp,
  };
  const moved = !lastSent || metresBetween(lastSent, latest) > MIN_MOVE_M;
  const accuracyChanged = lastSent &&
    (lastSent.accuracy_m <= ACCURACY_LIMIT_M) !== (latest.accuracy_m <= ACCURACY_LIMIT_M);
  const due = Date.now() - lastSentAt >= HEARTBEAT_MS;
  if (moved || accuracyChanged || due || lastError) {
    lastSent = latest;
    lastSentAt = Date.now();
    lastError = null;
    sendValue(latest);
  }
}

function onError(error) {
  const code = {1: "denied", 2: "unavailable", 3: "timeout"}[error.code] || "unavailable";
  // A slow fix while we already have a recent reading is not worth a rerun.
  if (code === "timeout" && latest) return;
  if (code !== lastError) {
    lastError = code;
    sendValue({error: code});
  }
}

function start(once) {
  if (started) return;
  started = true;
  if (!navigator.geolocation) {
    sendValue({error: "unsupported"});
    return;
  }
  const options = {enableHighAccuracy: true, maximumAge: 5000, timeout: 20000};
  if (once) {
    navigator.geolocation.getCurrentPosition(onPosition, onError, options);
    return;
  }
  navigator.geolocation.watchPosition(onPosition, onError, options);
  // Standing still produces no new watch events, so ask again regularly.
  setInterval(() => navigator.geolocation.getCurrentPosition(onPosition, onError, options), HEARTBEAT_MS);
}

window.addEventListener("message", (event) => {
  if (event.source === window.parent && event.data.type === "streamlit:render") {
    start(Boolean(event.data.args && event.data.args.once));
  }
});
send("streamlit:componentReady", {apiVersion: 1});
send("streamlit:setFrameHeight", {height: 0});
</script></body></html>
